name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate portfolio links and interactions
        run: |
          node scripts/check-portfolio.js
          find asset/js MediFind-Nearby-API scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node -e "JSON.parse(require('node:fs').readFileSync('MediFind-Nearby-API/package.json', 'utf8')); console.log('MediFind API package.json is valid')"

      - name: Validate interactive bank demo JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('bank-demo/index.html', 'utf8');
          const matches = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          if (matches.length !== 1) throw new Error('Expected exactly one inline bank demo script.');
          new Function(matches[0][1]);
          const styleStart = html.indexOf('<style>');
          const styleEnd = html.indexOf('</style>');
          if (styleStart < 0 || styleEnd < 0) throw new Error('Bank demo stylesheet is missing.');
          const css = html.slice(styleStart + 7, styleEnd).replace(/\/\*[\s\S]*?\*\//g, '');
          const stack = [];
          const pairs = { ')': '(', ']': '[', '}': '{' };
          for (const ch of css) {
            if ('([{'.includes(ch)) stack.push(ch);
            else if (')]}'.includes(ch) && stack.pop() !== pairs[ch]) throw new Error('Unbalanced CSS delimiter: ' + ch);
          }
          if (stack.length) throw new Error('Unclosed CSS delimiter: ' + stack.join(''));
          console.log('Bank demo JavaScript and CSS syntax checks passed');
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare portfolio site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R asset _site/asset
          mkdir -p _site/bank-demo
          cp bank-demo/index.html _site/bank-demo/index.html
          # Do not publish the superseded résumé PDF; the updated résumé page can be printed to PDF.
          rm -f _site/asset/resume/resume.pdf
          touch _site/.nojekyll

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Clear stale Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const staleSha = '8a567a71aace3764de7f9acb7d3886a764b3c48e';
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: 'github-pages',
              per_page: 100
            });
            for (const deployment of deployments.filter(item => item.sha === staleSha)) {
              const statuses = await github.rest.repos.listDeploymentStatuses({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                per_page: 1
              });
              if (statuses.data[0] && ['in_progress', 'pending', 'queued'].includes(statuses.data[0].state)) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  state: 'inactive',
                  description: 'Superseded by the current responsive-site release.'
                });
              }
            }

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
