name: Deploy portfolio to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate portfolio links and interactions
        run: |
          node scripts/check-portfolio.js
          find asset/js MediFind-Nearby-API scripts -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node -e "JSON.parse(require('node:fs').readFileSync('MediFind-Nearby-API/package.json', 'utf8')); console.log('MediFind API package.json is valid')"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare portfolio site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R asset _site/asset
          # Do not publish the superseded résumé PDF; the updated résumé page can be printed to PDF.
          rm -f _site/asset/resume/resume.pdf
          touch _site/.nojekyll

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
